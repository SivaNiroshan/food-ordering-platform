# Serves the built React app and forwards API + WebSocket traffic to the api container.
# Browser → nginx is one origin, so the refresh cookie stays same-site (SameSite=Strict works).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Docker's internal DNS. Looking "api" up per request (not once at startup) means a
  # restarted api container with a new IP is still found.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep idle live connections open (Socket.IO pings every 25 s).
    proxy_read_timeout 1h;
  }

  # Vite puts a content hash in these file names, so they can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Any other path is a React route: serve index.html, and never cache it,
  # so a new deploy is picked up on the next page load.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}